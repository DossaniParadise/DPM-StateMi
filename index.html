/* ============================================================
   0. HELPERS

const money = n => (n === null || n === undefined || isNaN(n)) ? "—" :
  (n < 0 ? "-" : "") + "$" + Math.abs(n).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fmtDate = ts => {
  if (!ts) return "";
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  return isNaN(d) ? "" : d.toLocaleDateString();
};
const fmtBytes = b => !b ? "" : b > 1048576 ? (b / 1048576).toFixed(1) + " MB" : Math.round(b / 1024) + " KB";
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
const ROLE_LABELS = { ADMIN: "Admin", FINANCE: "Finance", VP: "VP of Ops", DIRECTOR: "Director",
                      AREA_COACH: "District Manager", MANAGER: "Store Manager" };
const roleLabel = r => ROLE_LABELS[r] || r || "";
const isManager = s => !!s && CFG.managerRoles.includes(s.role);

// Status of a line for filters, colours and progress.
function lineStatus(l) {
  if (l.noReceipt) return "skip";
  if ((l.attachments || []).length) return "done";
  return "todo";
}

// Filestack preview URLs. Images resize natively; PDFs and Office docs are
// converted to a first-page JPG by Filestack's document conversion.
function thumbUrl(att, w) {
  if (!att || !att.handle) return "";
  const base = "https://cdn.filestackcontent.com/";
  const isImg = /^image\//.test(att.mimetype || "") || /\.(png|jpe?g|gif|webp|heic)$/i.test(att.name || "");
  if (isImg) return base + "resize=width:" + w + "/" + att.handle;
  return base + "output=format:jpg,page:1/resize=width:" + w + "/" + att.handle;
}

function cleanForFirestore(obj) {
  if (Array.isArray(obj)) return obj.map(cleanForFirestore);
  if (obj && typeof obj === "object" && !(obj.toDate) && obj.constructor === Object) {
    const o = {};
    Object.keys(obj).forEach(k => { if (obj[k] !== undefined) o[k] = cleanForFirestore(obj[k]); });
    return o;
  }
  return obj;
}

// Firestore's "Missing or insufficient permissions" means the security rules
// don't cover this app's collection yet. Say so, with the fix.
const RULES_SNIPPET =
`match /${CFG.statementsCollection}/{statementId} {
  allow read, write: if true;
  match /lines/{lineId} {
    allow read, write: if true;
  }
}`;
function isPermissionError(e) { return /permission|insufficient/i.test((e && (e.code + " " + e.message)) || ""); }
function explainError(e, what) {
  if (isPermissionError(e)) return what + " failed: Firestore rejected it (Missing or insufficient permissions).\n" +
    "The Firestore security rules don't allow the \"" + CFG.statementsCollection + "\" collection yet — see the yellow box at the top for the fix.";
  return what + " failed: " + ((e && e.message) || e);
}

  return (

  );
}

  const s = (v === null || v === undefined) ? "" : String(v);

}

/* ============================================================
   1. DIRECTORY + IDENTITY (same model as PayMi)
   ============================================================ */
const directoryService = {
  async load() {
    const bust = (CFG.directoryUrl.includes("?") ? "&" : "?") + "_=" + Date.now();
    const res = await fetch(CFG.directoryUrl + bust, { cache: "no-store" });
    if (!res.ok) throw new Error("Directory API " + res.status);
    const data = await res.json();
    const coaches = data.areaCoaches || {}, directors = data.directors || {},
          rests = data.restaurants || {}, staff = data.vps || data.supportStaff || {};
    const users = {};
    Object.values(directors).forEach(d => { users[d.id] = { id: d.id, name: d.name, email: (d.email || "").trim(), role: "DIRECTOR" }; });
    Object.values(coaches).forEach(c => { if (!users[c.id]) users[c.id] = { id: c.id, name: c.name, email: (c.email || "").trim(), role: "AREA_COACH" }; });
    Object.values(staff).forEach(s => { if (!users[s.id]) users[s.id] = { id: s.id, name: s.name, email: (s.email || "").trim(), role: "STAFF" }; });
    const stores = Object.values(rests).map(r => ({
      id: r.id, name: r.storeName || "(unnamed)", storeNumber: r.storeNumber || "",
      storeManager: r.storeManager || "", email: r.email || ""
    }));
    // VP: resolved by email from the live directory, config is the fallback.
    const cfgEmail = (CFG.vp.email || "").trim().toLowerCase();
    const vpRec = [...Object.values(staff), ...Object.values(directors), ...Object.values(coaches)]
      .find(r => (r.email || "").trim().toLowerCase() === cfgEmail);
    const vp = { email: cfgEmail, name: (vpRec && vpRec.name) || CFG.vp.name, id: (vpRec && vpRec.id) || ("vp:" + cfgEmail) };
    return { users, stores, vp };
  }
};

function resolveSession(email, pw, dir) {
  const lc = (email || "").trim().toLowerCase();
  if (!lc || !pw) return { error: "Enter your email and password." };
  const P = CFG.rolePasswords;
  const emailOf = o => (o && o.email ? o.email : "").toLowerCase();

  if (CFG.adminEmails.map(e => e.toLowerCase()).includes(lc)) {
    if (pw !== P.admin) return { error: "That password doesn't match the admin role." };
    return { id: "admin:" + lc, email: lc, name: "IT Support", role: "ADMIN" };
  }
  if (dir.vp && lc === dir.vp.email && pw === P.vp)
    return { id: dir.vp.id, email: lc, name: dir.vp.name, role: "VP" };

  const dirFinance = Object.values(dir.users).find(u => emailOf(u) === lc && u.role === "FINANCE");
  const seeded = CFG.financeUsers.find(u => u.email.toLowerCase() === lc);
  if (dirFinance || seeded) {
    if (pw !== P.finance) return { error: "That password doesn't match the finance role." };
    return { id: dirFinance ? dirFinance.id : "fin:" + lc, email: lc, name: (dirFinance || seeded).name, role: "FINANCE" };
  }
  const director = Object.values(dir.users).find(u => emailOf(u) === lc && u.role === "DIRECTOR");
  if (director) {
    if (pw !== P.director) return { error: "That password doesn't match the director role." };
    return { id: director.id, email: lc, name: director.name, role: "DIRECTOR" };
  }
  const coach = Object.values(dir.users).find(u => emailOf(u) === lc && u.role === "AREA_COACH");
  if (coach) {
    if (pw !== P.coach) return { error: "That password doesn't match the district manager role." };
    return { id: coach.id, email: lc, name: coach.name, role: "AREA_COACH" };
  }
  const store = dir.stores.find(s => (s.email || "").toLowerCase() === lc);
  if (store) {
    if (pw !== P.manager) return { error: "That password doesn't match the store role." };
    return { id: "store:" + store.id, email: lc, name: store.storeManager || store.name, role: "MANAGER", storeId: store.id };
  }
  if (dir.vp && lc === dir.vp.email) return { error: "That password doesn't match the VP role." };
  return { error: "We couldn't find that email in the directory. Check it's the email on file." };
}

/* ============================================================
   2. FILESTACK
   ============================================================ */
function useFilestack() {
  const ref = useRef(null);
  const [, bump] = useState(0);
  useEffect(() => {
    if (ref.current) return;
    let tries = 0;
    const t = setInterval(() => {
      if (window.filestack && CFG.filestackApiKey) {
        try { ref.current = window.filestack.init(CFG.filestackApiKey); bump(n => n + 1); } catch (e) {}
        clearInterval(t);
      } else if (++tries > 40) { clearInterval(t); bump(n => n + 1); }
    }, 250);
    return () => clearInterval(t);
  }, []);
  return ref.current;
}

function useFirebaseReady() {
  const [ready, setReady] = useState(!!window.FS);
  useEffect(() => {
    if (window.FS) { setReady(true); return; }
    const h = () => setReady(true);
    window.addEventListener("firebase-ready", h);
    return () => window.removeEventListener("firebase-ready", h);
  }, []);
  return ready;
}

/* ============================================================
   3. PAGE PREPARATION — PDF → page images + row rules
   ============================================================ */
// Find the horizontal rules Amex prints between rows. Returns their vertical
// positions as fractions of the page height (0..1), top to bottom.
function detectRules(canvas) {
  const w = canvas.width, h = canvas.height;
  const ctx = canvas.getContext("2d");
  const x0 = Math.round(w * 0.05), x1 = Math.round(w * 0.95), span = x1 - x0;
  const img = ctx.getImageData(x0, 0, span, h).data;
  const need = span * CFG.pages.ruleMinCoverage, dark = CFG.pages.ruleDarkness;
  const hits = [];
  for (let y = 0; y < h; y++) {
    let n = 0, off = y * span * 4;
    for (let x = 0; x < span; x++, off += 4) {
      // quick luminance
      if ((img[off] * 299 + img[off + 1] * 587 + img[off + 2] * 114) / 1000 < dark) n++;
    }
    if (n >= need) hits.push(y);
  }
  // merge adjacent pixel rows into one rule
  const rules = [];
  hits.forEach(y => {
    const r = rules[rules.length - 1];
    if (r && y - r[1] <= 2) r[1] = y; else rules.push([y, y]);
  });
  return rules.map(r => +(((r[0] + r[1]) / 2 + 0.5) / h).toFixed(4));
}

// Given a click position (fraction of page height) and the page's rules,
// return the row band [y0, y1] the click falls in.
function bandAt(yFrac, rules) {
  const P = CFG.pages;
  let above = -1, below = 2;
  (rules || []).forEach(r => { if (r <= yFrac && r > above) above = r; if (r > yFrac && r < below) below = r; });
  if (above >= 0 && below <= 1 && (below - above) <= P.maxBandHeight && (below - above) > 0.004) {
    return [above, below];
  }
  const half = P.defaultBandHeight / 2;
  return [Math.max(0, yFrac - half), Math.min(1, yFrac + half)];
}

async function preparePages(file, fs, stmtId, { onProgress, signal }) {
  if (!window.pdfjsLib) throw new Error("pdf.js didn't load. Check the network and reload.");
  window.pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
  const report = (stage, pct, detail) => onProgress && onProgress({ stage, pct, detail });

  report("Opening PDF", 2, file.name);
  const buf = await file.arrayBuffer();
  const pdf = await window.pdfjsLib.getDocument({ data: buf }).promise;
  const n = pdf.numPages;
  const pages = [];
  const folder = CFG.filestackBasePath + stmtId + "/";

  for (let p = 1; p <= n; p++) {
    if (signal && signal.aborted) throw new Error("Cancelled");
    report("Preparing page " + p + " of " + n, 4 + Math.round((p - 1) / n * 90), "rendering");
    const page = await pdf.getPage(p);
    const vp1 = page.getViewport({ scale: 1 });
    const scale = CFG.pages.width / vp1.width;
    const viewport = page.getViewport({ scale });
    const canvas = document.createElement("canvas");
    canvas.width = Math.round(viewport.width); canvas.height = Math.round(viewport.height);
    await page.render({ canvasContext: canvas.getContext("2d"), viewport }).promise;
    const rules = detectRules(canvas);
    const blob = await new Promise(res => canvas.toBlob(res, "image/jpeg", CFG.pages.quality));

    report("Preparing page " + p + " of " + n, 4 + Math.round((p - 0.5) / n * 90), "uploading " + fmtBytes(blob.size));
    let stored = null;
    if (fs) {
      const name = "page-" + String(p).padStart(2, "0") + ".jpg";
      const r = await fs.upload(blob, {}, { path: folder + "pages/" + name, filename: name });
      stored = { url: r.url, handle: r.handle };
    } else {
      // No Filestack: keep the image inline for this session only.
      stored = { url: URL.createObjectURL(blob), handle: "" };
    }
    pages.push({ n: p, url: stored.url, handle: stored.handle, w: canvas.width, h: canvas.height, rules });
    page.cleanup();
  }
  report("Done", 100, n + " pages ready");
  return { pages, pageCount: n };
}

/* ============================================================
   3b. LABEL OCR — read just the clicked strip (best effort)
   ============================================================ */
let _ocrWorker = null;
async function getOcrWorker() {
  if (!CFG.labelOcr || !window.Tesseract) return null;
  if (_ocrWorker) return _ocrWorker;
  _ocrWorker = (async () => {
    const w = await window.Tesseract.createWorker("eng", 1, {});
    await w.setParameters({ preserve_interword_spaces: "1", tessedit_pageseg_mode: "6" });
    return w;
  })();
  return _ocrWorker;
}
const fixDigits = s => s.replace(/[Oo]/g, "0").replace(/[Il|]/g, "1").replace(/S/g, "5");
function parseAmount(tok) {
  const t = fixDigits(tok.replace(/[^\d$.,\-]/g, ""));
  let m = t.match(/^(-)?\$?(\d{1,3}(?:,\d{3})*|\d+)\.(\d{2})$/) ||
          t.match(/^(-)?\$(\d{1,3}(?:,\d{3})*|\d+)[.,](\d{2})\d?$/);
  if (!m) return null;
  const v = parseFloat(m[2].replace(/,/g, "") + "." + m[3]);
  return m[1] ? -v : v;
}
function labelFromText(text) {
  const first = (text || "").split("\n").map(s => s.trim()).filter(Boolean)[0] || "";
  const toks = first.split(/\s+/);
  let date = "", amount = null;
  if (/^\d{1,2}\/\d{1,2}\/\d{2,4}$/.test(fixDigits(toks[0] || ""))) date = fixDigits(toks.shift());
  for (let i = toks.length - 1; i >= Math.max(0, toks.length - 3); i--) {
    const a = parseAmount(toks[i]); if (a !== null) { amount = a; toks.splice(i); break; }
  }
  const desc = toks.join(" ").replace(/(^|\s)1?T?™X?(?=\s|$)/g, "$1TX").replace(/[^\w\s*#&'./@:+-]/g, "")
    .replace(/\s+/g, " ").trim().slice(0, 80);
  return { date, desc, amount };
}
// Crops the band from the page image and OCRs it. Resolves to {date, desc, amount}
// or null if anything at all goes wrong (CORS, missing library, …).
async function readBand(pageImgUrl, band) {
  try {
    const worker = await getOcrWorker();
    if (!worker) return null;
    const img = await new Promise((res, rej) => { const i = new Image(); i.crossOrigin = "anonymous"; i.onload = () => res(i); i.onerror = rej; i.src = pageImgUrl; });
    const W = img.naturalWidth, H = img.naturalHeight;
    const y0 = Math.round(band[0] * H), y1 = Math.round(band[1] * H);
    const c = document.createElement("canvas");
    c.width = Math.round(W * 0.92); c.height = Math.max(8, y1 - y0);
    c.getContext("2d").drawImage(img, Math.round(W * 0.04), y0, c.width, c.height, 0, 0, c.width, c.height);
    const { data } = await worker.recognize(c);
    return labelFromText(data.text);
  } catch (e) { return null; }
}

/* ============================================================
   4. FIRESTORE SERVICE
   ============================================================ */
const svc = {
  col() { return window.FS.collection(window.FS.db, CFG.statementsCollection); },
  linesCol(sid) { return window.FS.collection(window.FS.db, CFG.statementsCollection, sid, "lines"); },

  subscribeStatements(cb, onErr) {
    const { query, orderBy, onSnapshot } = window.FS;
    return onSnapshot(query(this.col(), orderBy("createdAt", "desc")),
      snap => cb(snap.docs.map(d => ({ id: d.id, ...d.data() }))), onErr);
  },
  cache: {},   // sid -> latest lines from the live subscription (for counter sync)
  subscribeLines(sid, cb, onErr) {
    const { onSnapshot } = window.FS;
    return onSnapshot(this.linesCol(sid),
      snap => { const xs = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (a.page - b.page) || (a.y0 - b.y0)); this.cache[sid] = xs; cb(xs); }, onErr);
  },

  stats(lines) {
    const s = { done: 0, skip: 0, todo: 0, total: 0 };
    (lines || []).forEach(l => { s[lineStatus(l)]++; s.total += (+l.amount || 0); });
    return s;
  },
  async syncCounts(sid, lines) {
    const { doc, updateDoc, serverTimestamp } = window.FS;
    const s = this.stats(lines);
    try { await updateDoc(doc(this.col(), sid), { lineCount: lines.length, doneCount: s.done, skipCount: s.skip, total: s.total, updatedAt: serverTimestamp() }); } catch (e) {}
  },

  async createStatement(meta, session) {
    const { doc, setDoc, serverTimestamp } = window.FS;
    const sref = doc(this.col(), meta.id);
    const { id, ...rest } = meta;
    await setDoc(sref, cleanForFirestore({
      ...rest, lineCount: 0, doneCount: 0, skipCount: 0, total: 0, status: "ready",
      createdBy: { id: session.id, name: session.name, email: session.email },
      createdAt: serverTimestamp(), updatedAt: serverTimestamp()
    }));
    return sref.id;
  },
  async updateStatement(sid, patch) {
    const { doc, updateDoc, serverTimestamp } = window.FS;
    await updateDoc(doc(this.col(), sid), cleanForFirestore({ ...patch, updatedAt: serverTimestamp() }));
  },

  async addLine(sid, line, session, allLines) {
    const { doc, setDoc, serverTimestamp } = window.FS;
    const lref = doc(this.linesCol(sid), line.id);
    const { id, ...rest } = line;
    const data = cleanForFirestore({ attachments: [], note: "", noReceipt: false, desc: "", amount: null, date: "", ...rest,
      createdBy: { id: session.id, name: session.name }, createdAt: Date.now(),
      updatedAt: serverTimestamp(), updatedBy: { id: session.id, name: session.name } });
    await setDoc(lref, data);
    this.syncCounts(sid, [...(this.cache[sid] || allLines || []).filter(l => l.id !== line.id), { ...data, id: line.id }]);
  },
  async updateLine(sid, lid, patch, session, allLines) {
    const { doc, updateDoc, serverTimestamp } = window.FS;
    await updateDoc(doc(this.linesCol(sid), lid), cleanForFirestore({
      ...patch, updatedAt: serverTimestamp(), updatedBy: { id: session.id, name: session.name }
    }));
    const base = this.cache[sid] || allLines;
    if (base) this.syncCounts(sid, base.map(l => l.id === lid ? { ...l, ...patch } : l));
  },
  async deleteLine(sid, lid, allLines) {
    const { doc, deleteDoc } = window.FS;
    await deleteDoc(doc(this.linesCol(sid), lid));
    this.syncCounts(sid, (this.cache[sid] || allLines || []).filter(l => l.id !== lid));
  },
  async deleteStatement(sid) {
    const { getDocs, writeBatch, doc } = window.FS;
    const snap = await getDocs(this.linesCol(sid));
    let b = writeBatch(window.FS.db), n = 0;
    for (const d of snap.docs) {
      b.delete(d.ref);
      if (++n >= 400) { await b.commit(); b = writeBatch(window.FS.db); n = 0; }
    }
    b.delete(doc(this.col(), sid));
    await b.commit();
  }
};

/* ============================================================
   8. NEW STATEMENT — pick → prepare pages → name it
   ============================================================ */
function NewStatement({ session, fs, onDone, onCancel, toast, onPermError }) {
  const [step, setStep] = useState("pick");       // pick | working | name | saving
  const [file, setFile] = useState(null);
  const [prog, setProg] = useState({ stage: "", pct: 0, detail: "" });
  const [upload, setUpload] = useState({ pct: 0, done: null, err: "" });
  const [prepared, setPrepared] = useState(null);
  const [meta, setMeta] = useState({ title: "", closingDate: "", cardName: "" });
  const [err, setErr] = useState("");
  const abortRef = useRef(null);
  const fileInput = useRef(null);
  const stmtId = useMemo(() => uid(), []);

  function onPick(f) {
    if (!f) return;
    if (f.type !== "application/pdf" && !/\.pdf$/i.test(f.name)) { setErr("Please choose a PDF statement."); return; }
    setErr(""); setFile(f);
    setMeta(m => ({ ...m, title: m.title || f.name.replace(/\.pdf$/i, "") }));
  }

  async function start() {
    if (!file) return;
    setStep("working"); setErr("");
    const ac = new AbortController(); abortRef.current = ac;
    const uploadP = (async () => {
      if (!fs) { setUpload(u => ({ ...u, err: "Filestack didn't load — the original PDF won't be stored." })); return null; }
      try {
        const r = await fs.upload(file, { onProgress: e => setUpload(u => ({ ...u, pct: e.totalPercent || 0 })) },
                                  { path: CFG.filestackBasePath + stmtId + "/statement.pdf", filename: "statement.pdf" });
        const done = { url: r.url, handle: r.handle, name: file.name, size: r.size || file.size, mimetype: r.mimetype || "application/pdf" };
        setUpload({ pct: 100, done, err: "" });
        return done;
      } catch (e) { setUpload(u => ({ ...u, err: "PDF upload failed: " + (e.message || e) })); return null; }
    })();
    try {
      const res = await preparePages(file, fs, stmtId, { onProgress: setProg, signal: ac.signal });
      setPrepared(res);
      setStep("name");
    } catch (e) { setErr(e.message || String(e)); setStep("pick"); }
    await uploadP;
  }

  async function save() {
    if (!meta.title.trim()) { setErr("Give the statement a name."); return; }
    setStep("saving"); setErr("");
    try {
      await svc.createStatement({ id: stmtId, title: meta.title.trim(), closingDate: meta.closingDate.trim(), cardName: meta.cardName.trim(),
        pdf: upload.done || null, pages: prepared.pages, pageCount: prepared.pageCount,
        filestackFolder: CFG.filestackBasePath + stmtId + "/" }, session);
      toast("Statement ready — click a line to mark it.", "ok");
      onDone(stmtId);
    } catch (e) { setErr(explainError(e, "Save")); setStep("name"); if (isPermissionError(e)) onPermError && onPermError(); }
  }

  function cancel() { if (abortRef.current) abortRef.current.abort(); onCancel(); }

  if (step === "pick") return (
    <div className="mx-auto max-w-xl">
      <h2 className="text-xl font-semibold text-slate-900">New statement</h2>
      <p className="mt-1 text-sm text-slate-500">Choose the statement PDF. Each page is turned into an image you'll click on — a 15-page statement takes about half a minute.</p>
      <div onDragOver={e => e.preventDefault()} onDrop={e => { e.preventDefault(); onPick(e.dataTransfer.files[0]); }}
           onClick={() => fileInput.current.click()}
           className="mt-4 cursor-pointer rounded-xl border-2 border-dashed border-slate-300 bg-white p-10 text-center hover:border-[#2a5f9e]">
        <input ref={fileInput} type="file" accept="application/pdf,.pdf" className="hidden" onChange={e => onPick(e.target.files[0])} />
        {file
          ? <div><div className="font-medium text-slate-900">{file.name}</div><div className="text-xs text-slate-500">{fmtBytes(file.size)}</div></div>
          : <div className="text-sm text-slate-500"><div className="text-3xl">📄</div>Drop the PDF here or click to choose</div>}
      </div>
      {err && <p className="mt-3 whitespace-pre-line rounded-lg bg-red-50 px-3 py-2 text-sm text-red-700">{err}</p>}
      <div className="mt-4 flex gap-2">
        <button onClick={start} disabled={!file} className="rounded-lg bg-[#2a5f9e] px-4 py-2 text-sm font-medium text-white disabled:opacity-40">Prepare statement</button>
        <button onClick={onCancel} className="rounded-lg border px-4 py-2 text-sm text-slate-700">Cancel</button>
      </div>
    </div>
  );

  if (step === "working") return (
    <div className="mx-auto max-w-xl rounded-xl border bg-white p-6">
      <h2 className="text-lg font-semibold text-slate-900">Preparing {file.name}</h2>
      <div className="mt-4 text-sm font-medium text-slate-800">{prog.stage}</div>
      <div className="text-xs text-slate-500">{prog.detail}</div>
      <div className="mt-2 h-2.5 w-full overflow-hidden rounded-full bg-slate-200">
        <div className="progress-bar h-full bg-[#2a5f9e]" style={{ width: prog.pct + "%" }} />
      </div>
      <div className="mt-4 text-sm font-medium text-slate-800">Storing the original PDF</div>
      <div className="text-xs text-slate-500">{upload.err || (upload.done ? "Uploaded" : upload.pct + "%")}</div>
      <div className="mt-2 h-1.5 w-full overflow-hidden rounded-full bg-slate-200">
        <div className="progress-bar h-full bg-emerald-500" style={{ width: upload.pct + "%" }} />
      </div>
      <button onClick={cancel} className="mt-6 rounded-lg border px-4 py-2 text-sm text-slate-700">Cancel</button>
    </div>
  );

  return (
    <div className="mx-auto max-w-xl rounded-xl border bg-white p-6">
      <h2 className="text-lg font-semibold text-slate-900">Name the statement</h2>
      <p className="mt-1 text-sm text-slate-500">{prepared.pageCount} pages ready.</p>
      {err && <p className="mt-3 whitespace-pre-line rounded-lg bg-red-50 px-3 py-2 text-sm text-red-700">{err}</p>}
      {upload.err && <p className="mt-3 rounded-lg bg-amber-50 px-3 py-2 text-sm text-amber-800">{upload.err}</p>}
      <label className="mt-4 block text-sm"><span className="text-slate-600">Title</span>
        <input autoFocus value={meta.title} onChange={e => setMeta(m => ({ ...m, title: e.target.value }))}
               placeholder="e.g. Amex Business Platinum — Aug 2026" className="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm" /></label>
      <div className="mt-3 grid grid-cols-2 gap-3">
        <label className="block text-sm"><span className="text-slate-600">Closing date</span>
          <input value={meta.closingDate} onChange={e => setMeta(m => ({ ...m, closingDate: e.target.value }))}
                 placeholder="MM/DD/YY" className="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm" /></label>
        <label className="block text-sm"><span className="text-slate-600">Card (optional)</span>
          <input value={meta.cardName} onChange={e => setMeta(m => ({ ...m, cardName: e.target.value }))}
                 placeholder="Business Platinum …21007" className="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm" /></label>
      </div>
      <div className="mt-4 grid grid-cols-6 gap-1">
        {prepared.pages.slice(0, 12).map(p => <img key={p.n} src={p.url} className="rounded border" alt="" />)}
      </div>
      <div className="mt-5 flex gap-2">
        <button onClick={save} disabled={step === "saving"} className="rounded-lg bg-[#2a5f9e] px-4 py-2 text-sm font-medium text-white disabled:opacity-50">
          {step === "saving" ? "Saving…" : "Open statement"}
        </button>
        <button onClick={onCancel} className="rounded-lg border px-4 py-2 text-sm text-slate-700">Discard</button>
      </div>
    </div>
  );
}

      </div>

function LinePanel({ statement, line, lines, session, fs, onClose, toast }) {
  const [note, setNote] = useState(line.note || "");
  const [desc, setDesc] = useState(line.desc || "");
  const [amount, setAmount] = useState(line.amount === null || line.amount === undefined ? "" : String(line.amount));
  const [busy, setBusy] = useState(false);
  // Follow the line when it changes underneath us (another user, or the
  // background label OCR) — but never clobber text the user is typing.
  const prev = useRef({});
  useEffect(() => {
    const pa = line.amount === null || line.amount === undefined ? "" : String(line.amount);
    const fresh = prev.current.id !== line.id;
    if (fresh || desc === (prev.current.desc || "")) setDesc(line.desc || "");
    if (fresh || amount === (prev.current.amount || "")) setAmount(pa);
    if (fresh || note === (prev.current.note || "")) setNote(line.note || "");
    prev.current = { id: line.id, desc: line.desc || "", amount: pa, note: line.note || "" };
  }, [line.id, line.desc, line.amount, line.note]);
  useEffect(() => {
    const h = e => { if (e.key === "Escape") onClose(); };
    window.addEventListener("keydown", h); return () => window.removeEventListener("keydown", h);
  }, []);
  const atts = line.attachments || [];
  const st = lineStatus(line);

  function attach() {
    if (!fs) { toast("Upload isn't available — the Filestack script didn't load.", "err"); return; }
    setBusy(true);
    openPicker(fs, statement, line, session, lines, toast, () => setBusy(false));
  }
  async function patch(p) { try { await svc.updateLine(statement.id, line.id, p, session, lines); } catch (e) { toast(explainError(e, "Saving"), "err"); } }
  async function removeAtt(i) {
    if (!confirm("Remove this document from the line? (The file stays in Filestack.)")) return;
    patch({ attachments: atts.filter((_, k) => k !== i) });
  }
  async function toggleNoReceipt() {
    if (line.noReceipt) return patch({ noReceipt: false, noReceiptReason: "" });
    const reason = prompt("Why is no receipt needed? (optional)", line.noReceiptReason || "");
    if (reason === null) return;
    patch({ noReceipt: true, noReceiptReason: reason });
  }
  async function del() {
    if (!confirm("Remove this marked line" + (atts.length ? " and its " + atts.length + " attachment link(s)" : "") + "?")) return;
    try { await svc.deleteLine(statement.id, line.id, lines); onClose(); } catch (e) { toast(explainError(e, "Delete"), "err"); }
  }
  const saveLabel = () => {
    const a = amount.trim() === "" ? null : parseFloat(amount);
    if (desc !== (line.desc || "") || a !== (line.amount === undefined ? null : line.amount)) patch({ desc: desc.trim(), amount: isNaN(a) ? null : a });
  };

  return (
    <aside className="fixed inset-y-0 right-0 z-30 flex w-full max-w-md flex-col border-l bg-white shadow-2xl">
      <div className="flex items-start justify-between gap-3 border-b px-4 py-3">
        <div className="min-w-0">
          <div className="text-[10px] font-bold uppercase tracking-widest text-slate-400">Page {line.page}</div>
          <Chip status={st} />
        </div>
        <button onClick={onClose} className="rounded-lg px-2 py-1 text-slate-400 hover:bg-slate-100 hover:text-slate-700" title="Close (Esc)">✕</button>
      </div>
      <div className="flex-1 overflow-y-auto px-4 py-3">
        <div className="grid grid-cols-[1fr_110px] gap-2">
          <label className="block text-[11px] text-slate-500">Label
            <input value={desc} onChange={e => setDesc(e.target.value)} onBlur={saveLabel} placeholder={line.reading ? "Reading the line…" : "Merchant / what this is"}
                   className="mt-0.5 w-full rounded-lg border border-slate-300 px-2 py-1.5 text-sm text-slate-900" /></label>
          <label className="block text-[11px] text-slate-500">Amount
            <input type="number" step="0.01" value={amount} onChange={e => setAmount(e.target.value)} onBlur={saveLabel}
                   className="mt-0.5 w-full rounded-lg border border-slate-300 px-2 py-1.5 text-right text-sm text-slate-900" /></label>
        </div>
        {line.date && <div className="mt-1 text-[11px] text-slate-400">Transaction date {line.date}</div>}

        <div className="mt-4 mb-2 flex items-center justify-between">
          <div className="text-xs font-semibold uppercase tracking-wider text-slate-500">Documents ({atts.length})</div>
          <button onClick={attach} disabled={busy} className="rounded-lg bg-[#2a5f9e] px-3 py-1.5 text-xs font-medium text-white disabled:opacity-50">{busy ? "…" : "+ Attach"}</button>
        </div>
        {!atts.length && <div className="rounded-lg border border-dashed p-4 text-center text-sm text-slate-500">No receipt or supporting document yet.</div>}
        <div className="flex flex-wrap gap-3">
          {atts.map((a, i) => (
            <div key={i} className="relative">
              <AttachmentThumb att={a} size="lg" />
              <div className="text-[10px] text-slate-400">{fmtBytes(a.size)}{a.uploadedBy ? " · " + a.uploadedBy : ""}</div>
              <button onClick={() => removeAtt(i)} className="absolute -right-1 -top-1 h-5 w-5 rounded-full bg-white text-xs text-red-500 shadow hover:bg-red-50" title="Remove">✕</button>
            </div>
          ))}
        </div>

        <div className="mt-4 text-xs font-semibold uppercase tracking-wider text-slate-500">Note</div>
        <textarea value={note} onChange={e => setNote(e.target.value)} onBlur={() => { if (note !== (line.note || "")) patch({ note }); }}
                  rows="3" placeholder="Store #, purpose, who it was for…" className="mt-1 w-full rounded-lg border border-slate-300 px-2 py-1.5 text-sm" />

        <div className="mt-4 flex flex-wrap gap-2">
          <button onClick={toggleNoReceipt} className="rounded-lg border bg-white px-3 py-1.5 text-xs text-slate-700">
            {line.noReceipt ? "Receipt is needed after all" : "No receipt needed"}
          </button>
          {statement.pdf && <a href={statement.pdf.url + "#page=" + line.page} target="_blank" rel="noopener" className="rounded-lg border bg-white px-3 py-1.5 text-xs text-slate-700">Original PDF p.{line.page} ↗</a>}
          <button onClick={del} className="ml-auto text-xs text-red-500 hover:underline">Remove mark</button>
        </div>
        {line.updatedBy && <div className="mt-3 text-[11px] text-slate-400">Last updated by {line.updatedBy.name} · {fmtDate(line.updatedAt)}</div>}
      </div>
    </aside>
  );
}

// Shared Filestack picker for a line. `done` is called when the picker closes.
function openPicker(fs, statement, line, session, lines, toast, done) {
  fs.picker({
    accept: ["application/pdf", "image/*", ".heic", ".doc", ".docx", ".xls", ".xlsx", ".eml", ".msg"],
    maxFiles: 10,
    fromSources: ["local_file_system", "googledrive", "dropbox", "onedrive", "url"],
    storeTo: { path: (statement.filestackFolder || (CFG.filestackBasePath + statement.id + "/")) + line.id + "/" },
    onUploadDone: async r => {
      done && done();
      const files = (r.filesUploaded || []).map(f => ({
        url: f.url, handle: f.handle, name: f.filename, size: f.size, mimetype: f.mimetype,
        uploadedBy: session.name, uploadedAt: Date.now()
      }));
      if (!files.length) return;
      try {
        const current = (lines || []).find(l => l.id === line.id) || line;
        await svc.updateLine(statement.id, line.id, { attachments: [...(current.attachments || []), ...files] }, session, lines);
        toast(files.length + (files.length > 1 ? " files attached" : " file attached"), "ok");
      } catch (e) { toast(explainError(e, "Saving the attachment"), "err"); }
    },
    onFileUploadFailed: (f, e) => { done && done(); toast("Upload failed: " + ((e && e.message) || "unknown error"), "err"); },
    onClose: () => done && done()
  }).open();
}

function StatementPage({ page, lines, zoom, activeId, onHoverLine, onLeaveLine, onClickLine, onClickEmpty }) {
  const ref = useRef(null);
  const [ghost, setGhost] = useState(null);
  const pageLines = lines.filter(l => l.page === page.n);

  function yFrac(e) {
    const r = ref.current.getBoundingClientRect();
    return Math.min(1, Math.max(0, (e.clientY - r.top) / r.height));
  }
  function onMove(e) {
    if (e.target.closest(".band")) { setGhost(null); return; }
    const band = bandAt(yFrac(e), page.rules);
    // don't offer a ghost where a line already exists
    if (pageLines.some(l => band[0] < l.y1 && band[1] > l.y0)) { setGhost(null); return; }
    setGhost(band);
  }
  return (
    <div className="mx-auto" style={{ width: zoom + "%" }}>
      <div className="mb-1 flex items-center justify-between px-1 text-[11px] text-slate-400">
        <span>Page {page.n}</span>
        <span>{pageLines.length ? pageLines.length + " marked" : ""}</span>
      </div>
      <div ref={ref} className="page" onMouseMove={onMove} onMouseLeave={() => setGhost(null)}
           onClick={e => { if (e.target.closest(".band")) return; const b = bandAt(yFrac(e), page.rules);
                           if (pageLines.some(l => b[0] < l.y1 && b[1] > l.y0)) return; setGhost(null); onClickEmpty(page, b); }}>
        <img src={page.url} alt={"Statement page " + page.n} loading={page.n <= 2 ? "eager" : "lazy"} draggable="false"
             style={{ aspectRatio: page.w + " / " + page.h }} />
        {ghost && <div className="band-ghost" style={{ top: ghost[0] * 100 + "%", height: (ghost[1] - ghost[0]) * 100 + "%" }}>
          <span className="badge" style={{ background: "#2a5f9e" }}>+ click to mark</span>
        </div>}
        {pageLines.map(l => {
          const st = lineStatus(l), n = (l.attachments || []).length;
          return (
            <div key={l.id} className={"band band-" + st + (activeId === l.id ? " band-active" : "")}
                 style={{ top: l.y0 * 100 + "%", height: (l.y1 - l.y0) * 100 + "%" }}
                 onMouseEnter={e => onHoverLine(l, e)} onMouseMove={e => onHoverLine(l, e)} onMouseLeave={onLeaveLine}
                 onClick={e => { e.stopPropagation(); onClickLine(l); }}>
              <span className={"badge badge-" + st}>{st === "skip" ? "no receipt" : n ? "📎 " + n : "needs receipt"}</span>
            </div>
          );
        })}
      </div>
    </div>
  );
}

function StatementView({ statement, session, fs, onBack, toast }) {
  const [lines, setLines] = useState(null);
  const [hover, setHover] = useState(null);
  const [activeId, setActiveId] = useState(null);
  const [zoom, setZoom] = useState(() => { try { return +localStorage.getItem("statemi_zoom") || 100; } catch (e) { return 100; } });
  const [showList, setShowList] = useState(() => window.innerWidth > 1100);
  const [filter, setFilter] = useState("all");
  const [reading, setReading] = useState({});
  const pageRefs = useRef({});

  useEffect(() => {
    const un = svc.subscribeLines(statement.id, setLines, e => toast(explainError(e, "Loading lines"), "err"));
    return un;
  }, [statement.id]);
  useEffect(() => { try { localStorage.setItem("statemi_zoom", String(zoom)); } catch (e) {} }, [zoom]);

  const stats = useMemo(() => svc.stats(lines || []), [lines]);
  const active = (lines || []).find(l => l.id === activeId) || null;
  const pages = statement.pages || [];

  // Click on an unmarked row: create the line, open the picker right away,
  // and read the strip in the background for a label.
  async function markRow(page, band) {
    const line = { id: uid(), page: page.n, y0: band[0], y1: band[1] };
    try {
      await svc.addLine(statement.id, line, session, lines);
    } catch (e) { toast(explainError(e, "Marking the line"), "err"); return; }
    setActiveId(line.id);
    if (fs) openPicker(fs, statement, line, session, lines, toast, null);
    if (CFG.labelOcr) {
      setReading(r => ({ ...r, [line.id]: true }));
      const lbl = await readBand(page.url, band);
      setReading(r => { const c = { ...r }; delete c[line.id]; return c; });
      if (lbl && (lbl.desc || lbl.amount !== null)) {
        const current = (lines || []).find(l => l.id === line.id);
        if (!current || (!current.desc && (current.amount === null || current.amount === undefined)))
          svc.updateLine(statement.id, line.id, { desc: lbl.desc, amount: lbl.amount, date: lbl.date }, session, null).catch(() => {});
      }
    }
  }

  function centerLine(l, behavior) {
    const el = pageRefs.current[l.page];
    if (!el) return;
    const r = el.getBoundingClientRect();
    window.scrollTo({ top: window.scrollY + r.top + r.height * l.y0 - window.innerHeight / 2, behavior: behavior || "smooth" });
  }
  function scrollToLine(l) { setActiveId(l.id); }
  // Opening the side panel narrows the page column, which moves everything;
  // re-centre the active line after the layout has settled.
  const lastActive = useRef(null);
  useEffect(() => {
    const target = active || lastActive.current;   // closing: keep the line you were on in view
    if (active) lastActive.current = active;
    if (!target) return;
    const t = setTimeout(() => centerLine(target, "auto"), 30);
    return () => clearTimeout(t);
  }, [activeId]);

  function exportCsv() {
    const rows = [["#", "Page", "Date", "Label", "Amount", "Status", "Note", "No-receipt reason", "Attachments", "Attachment URLs", "Marked by"]];
    (lines || []).forEach((l, i) => rows.push([i + 1, l.page, l.date, l.desc, l.amount,
      { done: "Attached", skip: "No receipt needed", todo: "Missing" }[lineStatus(l)], l.note, l.noReceiptReason,
      (l.attachments || []).map(a => a.name).join(" | "), (l.attachments || []).map(a => a.url).join(" | "), l.createdBy && l.createdBy.name]));
    const csv = rows.map(r => r.map(csvEscape).join(",")).join("\n");
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" }));
    a.download = (statement.title || "statement").replace(/[^\w\-]+/g, "_") + ".csv";
    a.click();
  }

  const listed = (lines || []).filter(l => filter === "all" || lineStatus(l) === filter);

  return (
    <div onMouseLeave={() => setHover(null)}>
      <HoverCard hover={hover} />
      {active && <LinePanel statement={statement} line={{ ...active, reading: !!reading[active.id] }} lines={lines} session={session} fs={fs}
                            onClose={() => setActiveId(null)} toast={toast} />}

      <div className="sticky top-0 z-20 -mx-4 mb-3 border-b bg-slate-100/95 px-4 py-2 backdrop-blur">
        <div className="flex flex-wrap items-center gap-x-4 gap-y-2">
          <button onClick={onBack} className="text-sm text-[#2a5f9e] hover:underline">← Statements</button>
          <div className="min-w-0 flex-1">
            <div className="truncate font-semibold text-slate-900">{statement.title}</div>
            <div className="text-[11px] text-slate-500">
              {stats.todo === 0 && lines && lines.length ? "All marked lines have a receipt" : stats.todo + " waiting for a receipt"} · {stats.done} attached · {stats.skip} no receipt · {(lines || []).length} marked
              {statement.pdf && <a href={statement.pdf.url} target="_blank" rel="noopener" className="ml-2 text-[#2a5f9e] hover:underline">Original PDF ↗</a>}
            </div>
          </div>
          <div className="flex items-center gap-1 text-xs">
            <span className="text-slate-500">Zoom</span>
            {[70, 100, 130, 160].map(z => (
              <button key={z} onClick={() => setZoom(z)} className={"rounded-md border px-2 py-1 " + (zoom === z ? "border-[#2a5f9e] bg-[#eaf1fb] text-[#2a5f9e]" : "bg-white text-slate-600")}>{z}%</button>
            ))}
          </div>
          <button onClick={() => setShowList(s => !s)} className="rounded-lg border bg-white px-3 py-1.5 text-xs text-slate-700">{showList ? "Hide list" : "Show list"}</button>
          <button onClick={exportCsv} className="rounded-lg border bg-white px-3 py-1.5 text-xs text-slate-700">Export CSV</button>
        </div>
        <div className="mt-2"><Progress done={stats.done} skip={stats.skip} total={(lines || []).length} small /></div>
      </div>

      <div className={"flex gap-4 " + (active ? "pr-[28rem]" : "")}>
        <div className="min-w-0 flex-1 space-y-6 overflow-x-auto">
          {lines === null && <div className="rounded-xl border bg-white p-8 text-center text-sm text-slate-500"><Spinner /> Loading…</div>}
          {lines !== null && !lines.length && (
            <div className="rounded-xl border border-[#2a5f9e]/30 bg-[#eaf1fb] p-3 text-sm text-slate-700">
              Move the mouse over a line on the statement — it highlights across the full width. Click it to mark it and attach the receipt.
            </div>
          )}
          {lines !== null && pages.map(p => (
            <div key={p.n} ref={el => { pageRefs.current[p.n] = el; }}>
              <StatementPage page={p} lines={lines} zoom={zoom} activeId={activeId}
                             onHoverLine={(l, e) => setHover({ line: l, x: e.clientX, y: e.clientY })}
                             onLeaveLine={() => setHover(null)}
                             onClickLine={l => { setHover(null); setActiveId(l.id); }}
                             onClickEmpty={markRow} />
            </div>
          ))}
        </div>

        {showList && !active && lines !== null && (
          <aside className="hidden w-72 shrink-0 lg:block">
            <div className="sticky top-24 rounded-xl border bg-white">
              <div className="flex flex-wrap gap-1 border-b p-2">
                {[["all", "All"], ["todo", "Waiting"], ["done", "Attached"], ["skip", "No receipt"]].map(([k, label]) => (
                  <button key={k} onClick={() => setFilter(k)} className={"rounded-full border px-2 py-0.5 text-[11px] font-medium " + (filter === k ? "border-[#2a5f9e] bg-[#eaf1fb] text-[#2a5f9e]" : "bg-white text-slate-600")}>
                    {label} <span className="text-slate-400">{k === "all" ? (lines || []).length : stats[k]}</span>
                  </button>
                ))}
              </div>
              <div className="max-h-[70vh] overflow-y-auto">
                {!listed.length && <div className="p-4 text-center text-xs text-slate-400">Nothing here yet.</div>}
                {listed.map(l => {
                  const st = lineStatus(l);
                  return (
                    <button key={l.id} onClick={() => scrollToLine(l)}
                            className={"flex w-full items-center gap-2 border-b px-3 py-2 text-left text-xs hover:bg-slate-50 " + (activeId === l.id ? "bg-[#eaf1fb]" : "")}>
                      <span className={"h-2 w-2 shrink-0 rounded-full " + (st === "done" ? "bg-emerald-500" : st === "skip" ? "bg-slate-400" : "bg-amber-500")} />
                      <span className="min-w-0 flex-1">
                        <span className="block truncate font-medium text-slate-800">{l.desc || (reading[l.id] ? "Reading…" : "Page " + l.page + " line")}</span>
                        <span className="block text-[10px] text-slate-400">p.{l.page}{l.date ? " · " + l.date : ""}{(l.attachments || []).length ? " · 📎 " + l.attachments.length : ""}</span>
                      </span>
                      {l.amount !== null && l.amount !== undefined && <span className="shrink-0 font-semibold text-slate-700">{money(l.amount)}</span>}
                    </button>
                  );
                })}
              </div>
            </div>
          </aside>
        )}
      </div>
    </div>
  );
}

/* ============================================================
   10. APP SHELL
   ============================================================ */
function App() {
  const fbReady = useFirebaseReady();
  const fs = useFilestack();
  const [toast, showToast] = useToast();
  const [dir, setDir] = useState(null);
  const [dirError, setDirError] = useState("");
  const [session, setSession] = useState(null);
  const [view, setView] = useState({ name: "list" });
  const [statements, setStatements] = useState([]);
  const [loadingStmts, setLoadingStmts] = useState(true);
  const [permError, setPermError] = useState(false);

  useEffect(() => {
    directoryService.load().then(d => {
      setDir(d);
      try {
        const saved = JSON.parse(localStorage.getItem(SESSION_KEY) || "null");
        if (saved) {
          const s = resolveSession(saved.email, saved.pw, d);
          if (!s.error) setSession(s); else localStorage.removeItem(SESSION_KEY);
        }
      } catch (e) {}
    }).catch(e => setDirError("Couldn't load the directory: " + e.message));
  }, []);

  useEffect(() => {
    if (!fbReady || !session) return;
    setLoadingStmts(true);
    const un = svc.subscribeStatements(xs => { setStatements(xs); setLoadingStmts(false); },
      e => { setLoadingStmts(false); if (isPermissionError(e)) setPermError(true); else showToast("Firestore: " + e.message, "err"); });
    return un;
  }, [fbReady, session]);

  function signIn(sess, creds) {
    setSession(sess);
    try { localStorage.setItem(SESSION_KEY, JSON.stringify(creds)); } catch (e) {}
  }
  function signOut() {
    setSession(null); setView({ name: "list" });
    try { localStorage.removeItem(SESSION_KEY); } catch (e) {}
  }
  async function deleteStatement(s) {
    if (!confirm("Delete “" + s.title + "” and all its marked lines? Files already uploaded stay in Filestack.")) return;
    try { await svc.deleteStatement(s.id); showToast("Statement deleted", "ok"); } catch (e) { showToast(explainError(e, "Delete"), "err"); }
  }

  if (!session) return <div><Login dir={dir} dirError={dirError} onSignIn={signIn} /><Toast toast={toast} /></div>;
  const current = view.name === "statement" ? statements.find(s => s.id === view.id) : null;

  return (
    <div className="mx-auto max-w-[1600px] p-4">
      <header className="mb-4 flex flex-wrap items-center justify-between gap-3">
        <div className="flex items-center gap-3">
          <div className="flex h-9 w-9 items-center justify-center rounded-lg bg-[#2a5f9e] text-lg text-white">🧾</div>
          <div>
            <div className="text-[10px] font-bold uppercase tracking-widest text-[#8c909a]">DPM</div>
            <div className="-mt-0.5 font-semibold text-slate-900">StateMi <span className="ml-1 text-xs font-normal text-slate-400">statement visualizer</span></div>
          </div>
        </div>
        <div className="flex items-center gap-3 text-sm">
          <span className="text-slate-600"><b>{session.name}</b> <span className="text-slate-400">· {roleLabel(session.role)}</span></span>
          <button onClick={signOut} className="rounded-lg border bg-white px-3 py-1.5 text-xs text-slate-700 hover:bg-slate-50">Sign out</button>
        </div>
      </header>

      {permError && <PermissionBanner />}
      {view.name === "list" && (
        <StatementList statements={statements} loading={loadingStmts} session={session}
                       onOpen={s => setView({ name: "statement", id: s.id })} onNew={() => setView({ name: "new" })} onDelete={deleteStatement} />
      )}
      {view.name === "new" && (
        <NewStatement session={session} fs={fs} toast={showToast} onPermError={() => setPermError(true)}
                      onDone={id => setView({ name: "statement", id })} onCancel={() => setView({ name: "list" })} />
      )}
      {view.name === "statement" && (current
        ? <StatementView statement={current} session={session} fs={fs} toast={showToast} onBack={() => setView({ name: "list" })} />
        : <div className="rounded-xl border bg-white p-8 text-center text-sm text-slate-500">{loadingStmts ? <Spinner /> : "That statement is no longer available."}</div>)}

      <footer className="mt-8 text-center text-[11px] text-slate-400">StateMi v{CFG.version} · pages prepared in your browser · files in Filestack · data in Firestore</footer>
      <Toast toast={toast} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
